<section class="section active" id="company">
  <div id="company-root" class="section-body">
    <div class="company-screen">
      <div class="company-topbar">
        <div class="company-topbar-left">
          <h2 class="section-title">会社 (CP01)</h2>
          <div class="company-search">
            <label class="company-search-label" for="companySearchName">会社名</label>
            <input id="companySearchName" type="text" placeholder="会社名（部分一致）" />
            <button class="btn btn-secondary" id="btnCompanySearch">
              <span class="btn-icon">🔍</span>
              検索
            </button>
            <button class="btn btn-secondary" id="btnCompanyAdvancedSearch">
              <span class="btn-icon">▼</span>
              詳細検索
            </button>
            <button class="btn btn-secondary" id="btnCompanyClear">
              <span class="btn-icon">×</span>
              クリア
            </button>
          </div>
        </div>

        <div class="company-topbar-right">
          <!-- <button class="btn btn-secondary" id="btnCompanyExport">📥 エクスポート</button> -->
          <button class="btn btn-orange" id="btnCompanyCreate">
            <span class="btn-icon">＋</span>
            新規会社
          </button>
        </div>
      </div>

      <div class="company-main">
        <div class="company-grid">

        <div class="company-grid-header-left">
          <div class="company-grid-meta" id="companyResultMeta">全 0 件</div>
        </div>
      </div> -->

          <div class="company-table-wrap">
            <div class="company-table-scroll">
              <table class="company-table" aria-label="company list">
                <thead>
                  <tr>
                    <th style="width: 80px;">会社ID</th>
                    <th style="width: 250px;">会社名</th>
                    <th style="width: 130px;">代表TEL</th>
                    <th style="width: 300px;">住所</th>
                    <th style="width: 120px;">業界</th>
                    <th style="width: 120px;">業種</th>
                    <th style="width: 120px;">規模ランク</th>
                    <th style="width: 100px;">種別</th>
                    <th style="width: 100px;">従業員数</th>
                    <th style="width: 80px;">地区</th>
                    <th style="width: 110px;">都道府県</th>
                    <th style="width: 300px;">会社備考</th>
                  </tr>
                </thead>
                <tbody id="companyTableBody"></tbody>
              </table>
            </div>
          </div>

          <div class="company-grid-footer">
            <div class="footer-left">
              <div class="company-grid-pager">
                <button class="icon-btn" id="btnCompanyFirstPage" title="First Page">«</button>
                <button class="icon-btn" id="btnCompanyPrevPage" title="Previous Page">‹</button>
                <div id="companyPageNumbers" class="page-numbers"></div>
                <button class="icon-btn" id="btnCompanyNextPage" title="Next Page">›</button>
                <button class="icon-btn" id="btnCompanyLastPage" title="Last Page">»</button>

                <div class="pager-jump">
                  Page
                  <select id="companyPageSelect" class="mini-select" aria-label="page select"></select>
                  <span id="companyPageTotal" style="width: 50px;">/ 1</span>
                </div>

                <select id="companyPageSize" class="mini-select" aria-label="page size">
                  <option value="10">10件</option>
                  <option value="25">25件</option>
                  <option value="50">50件</option>
                  <option value="100" selected>100件</option>
                </select>
              </div>
            </div>
            <div class="footer-right">
              <div class="company-grid-meta">
                全 <span id="companyTotalCount">0</span> 件
                <span class="range-info"><span id="companyRangeStart">0</span> - <span
                    id="companyRangeEnd">0</span></span>
              </div>
            </div>
          </div>
        </div>

        <div class="company-detail">

            <div class="tabs-list">
              <button class="tab-btn active" data-company-tab="detail" role="tab" aria-selected="true">会社詳細</button>

              <button class="btn btn-orange" id="btnNewProject" style="display:none">＋ 新規案件</button>

          <div class="company-tabpanels">

                <div class="form-col">
                  <div class="form-row">
                    <label>会社ID</label>
                    <input id="companyDetailId" type="text" disabled />

                  <div class="form-row">
                    <label>会社名 <span class="req">*</span></label>

                  <div class="form-row">
                    <label>代表TEL</label>
                    <input id="companyDetailTel" type="text" />

                  <div class="form-row">

                    <input id="companyDetailFax" type="text" />
                  </div>
                  <div class="form-row two">
                    <div>
                      <label>地区</label>
                      <select id="companyDetailArea">
                        <option value="">-</option>
                        <option>関東</option>
                        <option>関西</option>
                        <option>中部</option>
                        <option>東北</option>
                        <option>九州</option>
                      </select>
                    </div>
                    <div></div>
                  </div>
                  <div class="form-row two">
                    <div>
                      <label>郵便番号</label>
                      <input id="companyDetailPostal" type="text" />
                    </div>
                    <div>
                      <label>都道府県</label>
                      <select id="companyDetailPref">
                        <option value="">-</option>
                        <option>北海道</option>
                        <option>東京都</option>
                        <option>大阪府</option>
                        <option>愛知県</option>
                        <option>福岡県</option>
                      </select>
                    </div>

                  <div class="form-row">
                    <label>住所</label>
                    <input id="companyDetailAddr" type="text" />

                    <label>禁止設定</label>

                      <label class="check"><input id="companyDetailNoTel" type="checkbox" /> TEL禁止</label>
                    </div>
                  </div>

                <!-- Column 2 -->
                <div class="form-col">
                  <div class="form-row">
                    <label>業界</label>
                    <select id="companyDetailIndustry">
                      <option value="">-</option>
                      <option>製造業</option>
                      <option>卸売業</option>
                      <option>小売業</option>
                      <option>金融業</option>
                    </select>
                  </div>

                    <label>業種</label>
                    <select id="companyDetailBiz">
                      <option value="">-</option>

                      <option>101～300人</option>
                      <option>301人以上</option>
                    </select>

                  <div class="form-row">
                    <label>会社種別</label>
                    <select id="companyDetailType">
                      <option value="">-</option>
                      <option>メーカー</option>

                    <label>法人番号</label>

                    <label>資本金（百万円）</label>
                    <input id="companyDetailCapital" type="text" />

                    <div>

                      <input id="companyDetailCreatedAt" type="text" disabled />
                    </div>
                    <div>
                      <label>作成者</label>
                      <input id="companyDetailCreatedBy" type="text" disabled />
                    </div>
                  </div>
                  <div class="form-row two">
                    <div>
                      <label>更新日</label>
                      <input id="companyDetailUpdatedAt" type="text" disabled />

                  <div class="form-row"><label>会社自由使用欄3</label><input id="companyDetailFree3" type="text" /></div>
                  <div class="form-row"><label>会社自由使用欄4</label><input id="companyDetailFree4" type="text" /></div>
                  <div class="form-row"><label>会社自由使用欄5</label><input id="companyDetailFree5" type="text" /></div>
                  <div class="form-row"><label>会社自由使用欄6</label><input id="companyDetailFree6" type="text" /></div>
                  <div class="form-row"><label>会社自由使用欄7</label><input id="companyDetailFree7" type="text" /></div>

                      ここにドラッグ＆ドロップ</div>
                  </div>
                  <div class="form-actions" style="justify-content: space-between; margin-top: auto; padding-top:0;">
                    <button class="btn btn-secondary" id="btnCompanyDelete" style="background:#f9f9f9;">削除</button>
                    <button class="btn btn-primary" id="btnCompanySave">保存</button>
                  </div>
                </div>

            <section class="company-panel" data-company-panel="contacts" role="tabpanel">

              </div>
            </section>
          </div>
        </div>
      </div>

    <dialog id="dlgCompanyAdvancedSearch" class="dlg dlg-wide">
      <form method="dialog" class="dlg-body" id="formCompanyAdvancedSearch">

          <div class="dlg-title">【詳細条件】会社検索(CP02)</div>
          <button class="icon-btn" value="cancel" aria-label="close">✕</button>
        </div>

        <div class="dlg-content">
          <div class="dlg-grid three-col">
            <!-- Column 1 -->
            <div class="form-col">
              <div class="form-row">
                <label>検索ワード</label>
                <input name="keyword" type="text" placeholder="全項目から部分一致" />
              </div>
              <div class="form-row">
                <label>会社名</label>
                <input name="name" type="text" placeholder="部分一致" />
              </div>
              <div class="form-row">
                <label>業界</label>
                <div class="multi-select-dropdown" data-name="industry" data-placeholder="業界を選択">
                  <div class="multi-select-trigger">業界を選択</div>
                  <div class="multi-select-content">
                    <label class="multi-select-option"><input type="checkbox" value="製造業"> 製造業</label>

                    <label class="multi-select-option"><input type="checkbox" value="小売業"> 小売業</label>
                    <label class="multi-select-option"><input type="checkbox" value="金融業"> 金融業</label>
                  </div>
                </div>
              </div>
              <div class="form-row">
                <label>業種</label>
                <div class="multi-select-dropdown" data-name="biz" data-placeholder="業種を選択">
                  <div class="multi-select-trigger">業種を選択</div>
                  <div class="multi-select-content">
                    <label class="multi-select-option"><input type="checkbox" value="金属製品"> 金属製品</label>
                    <label class="multi-select-option"><input type="checkbox" value="化学・素材"> 化学・素材</label>
                    <label class="multi-select-option"><input type="checkbox" value="自動車・輸送用機械"> 自動車・輸送用機械</label>
                    <label class="multi-select-option"><input type="checkbox" value="木工・家具"> 木工・家具</label>
                  </div>
                </div>
              </div>
              <div class="form-row">
                <label>規模ランク</label>
                <div class="multi-select-dropdown" data-name="scale" data-placeholder="規模を選択">
                  <div class="multi-select-trigger">規模を選択</div>
                  <div class="multi-select-content">
                    <label class="multi-select-option"><input type="checkbox" value="1～30人"> 1～30人</label>
                    <label class="multi-select-option"><input type="checkbox" value="31～100人"> 31～100人</label>
                    <label class="multi-select-option"><input type="checkbox" value="101～300人"> 101～300人</label>
                    <label class="multi-select-option"><input type="checkbox" value="301人以上"> 301人以上</label>
                  </div>
                </div>
              </div>
              <div class="form-row">
                <label>会社種別</label>
                <div class="multi-select-dropdown" data-name="type" data-placeholder="種別を選択">
                  <div class="multi-select-trigger">種別を選択</div>
                  <div class="multi-select-content">
                    <label class="multi-select-option"><input type="checkbox" value="メーカー"> メーカー</label>
                    <label class="multi-select-option"><input type="checkbox" value="その他"> その他</label>
                  </div>
                </div>
              </div>
            </div>

            <!-- Column 2 -->
            <div class="form-col">
              <div class="form-row">
                <label>地区</label>
                <div class="multi-select-dropdown" data-name="area" data-placeholder="地区を選択">
                  <div class="multi-select-trigger">地区を選択</div>
                  <div class="multi-select-content">
                    <label class="multi-select-option"><input type="checkbox" value="関東"> 関東</label>
                    <label class="multi-select-option"><input type="checkbox" value="関西"> 関西</label>
                    <label class="multi-select-option"><input type="checkbox" value="中部"> 中部</label>
                    <label class="multi-select-option"><input type="checkbox" value="東北"> 東北</label>
                    <label class="multi-select-option"><input type="checkbox" value="九州"> 九州</label>
                  </div>
                </div>
              </div>
              <div class="form-row two">
                <div>
                  <label>郵便番号</label>
                  <input name="postal" type="text" />
                </div>
                <div>
                  <label>都道府県</label>
                  <div class="multi-select-dropdown" data-name="pref" data-placeholder="都道府県を選択">
                    <div class="multi-select-trigger">選択..</div>
                    <div class="multi-select-content">
                      <label class="multi-select-option"><input type="checkbox" value="北海道"> 北海道</label>
                      <label class="multi-select-option"><input type="checkbox" value="東京都"> 東京都</label>
                      <label class="multi-select-option"><input type="checkbox" value="大阪府"> 大阪府</label>
                      <label class="multi-select-option"><input type="checkbox" value="愛知県"> 愛知県</label>
                      <label class="multi-select-option"><input type="checkbox" value="福岡県"> 福岡県</label>
                    </div>
                  </div>
                </div>
              </div>
              <div class="form-row">
                <label>住所</label>
                <input name="addr" type="text" placeholder="部分一致" />
              </div>
              <div class="form-row two">
                <div>
                  <label>代表TEL</label>
                  <input name="tel" type="text" />
                </div>
                <div>
                  <label>代表FAX</label>
                  <input name="fax" type="text" />
                </div>
              </div>
              <div class="form-row range-row">
                <label>決算月</label>
                <div class="range-inputs">
                  <input name="closingMonthFrom" type="text" placeholder="1" />
                  <span class="range-sep">～</span>
                  <input name="closingMonthTo" type="text" placeholder="12" />

              </div>
              <div class="form-row range-row">
                <label>資本金額</label>
                <div class="range-inputs">
                  <input name="capitalFrom" type="text" />
                  <span class="range-sep">～</span>
                  <input name="capitalTo" type="text" />
                  <span class="range-unit">(百万円)</span>
                </div>
              </div>
            </div>

            <!-- Column 3 -->
            <div class="form-col">
              <div class="form-row"><label>会社自由使用欄1</label><input name="free1" type="text" /></div>
              <div class="form-row"><label>会社自由使用欄2</label><input name="free2" type="text" /></div>
              <div class="form-row"><label>会社自由使用欄3</label><input name="free3" type="text" /></div>
              <div class="form-row"><label>会社自由使用欄4</label><input name="free4" type="text" /></div>
              <div class="form-row"><label>会社自由使用欄5</label><input name="free5" type="text" /></div>
              <div class="form-row"><label>会社自由使用欄6</label><input name="free6" type="text" /></div>
              <div class="form-row"><label>会社自由使用欄7</label><input name="free7" type="text" /></div>
            </div>
          </div>
        </div>

        <div class="dlg-actions">

            style="background:#001f3f; color:white; margin-left: auto; width: 100px;">検索</button>
        </div>
      </form>
    </dialog>
