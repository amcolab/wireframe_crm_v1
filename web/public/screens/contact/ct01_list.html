<section class="section active" id="contact">
  <div class="section-body" id="contact-root">
    <div class="company-screen">
      <div class="search-header search-header--multi">
        <div class="screen-title">担当 <span class="code">(CT01)</span></div>
        <div class="field">
          <label for="contactSearchCompany">会社名</label>
          <input id="contactSearchCompany" class="input" type="text" placeholder="部分一致" style="width:min(200px,28vw)" />
        </div>
        <div class="field">
          <label for="contactSearchName">担当者名</label>
          <input id="contactSearchName" class="input" type="text" placeholder="部分一致" style="width:min(160px,24vw)" />
        </div>
        <button class="btn btn-secondary" id="btnContactSearch" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          検索
        </button>
        <button class="btn btn-secondary" id="btnContactAdvancedSearch" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
          詳細検索
        </button>
        <button class="btn btn-secondary" id="btnContactClear" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
          クリア
        </button>
        <div class="right">
          <button class="btn btn-secondary" id="btnContactExport" type="button">エクスポート</button>
          <button class="btn btn-accent" id="btnContactCreateMain" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>
            新規担当
          </button>
        </div>
      </div>
      <div class="company-main">
        <div class="list-stack">
          <div class="panel">
            <div class="company-table-wrap table-wrap">
              <table class="t" id="contactTable">
                <colgroup>
                  <col style="width:120px"><col style="width:220px"><col style="width:120px">
                  <col style="width:90px"><col style="width:90px"><col style="width:140px">
                  <col style="width:120px"><col style="width:120px"><col style="width:180px">
                  <col style="width:90px"><col style="width:90px"><col style="width:140px">
                  <col style="width:200px">
                </colgroup>
                <thead><tr>
                    <th data-col-key="companyId">会社ID</th><th data-col-key="company">会社名</th><th data-col-key="dept">部署名</th>
                    <th data-col-key="last">担当(姓)</th><th data-col-key="first">担当(名)</th>
                    <th data-col-key="kana">フリガナ</th><th data-col-key="tel">TEL</th><th data-col-key="mobile">携帯電話</th>
                    <th data-col-key="email">Email</th><th data-col-key="role">職種</th>
                    <th data-col-key="rank">職位</th><th data-col-key="pos">役職名</th><th data-col-key="addr">住所</th>
                </tr></thead>
                <tbody id="contactTableBody"></tbody>
              </table>
            </div>
          </div>
          <div class="pager-standalone">
            <div class="pages">
              <button class="pg-btn" id="btnContactFirstPage" type="button" title="最初へ">«</button>
              <button class="pg-btn" id="btnContactPrevPage" type="button" title="前へ">‹</button>
              <div id="contactPageNumbers" class="page-numbers" style="display:inline-flex;gap:3px;"></div>
              <button class="pg-btn" id="btnContactNextPage" type="button" title="次へ">›</button>
              <button class="pg-btn" id="btnContactLastPage" type="button" title="最後へ">»</button>
            </div>
            <div class="page-jump">
              <span>Page</span>
              <select id="contactPageSelect" class="mini" aria-label="page select"></select>
              <span id="contactPageTotal">/ 1</span>
            </div>
            <select id="contactPageSize" class="pgsize-trigger" aria-label="page size">
              <option value="10">10件</option>
              <option value="25" selected>25件</option>
              <option value="50">50件</option>
              <option value="100">100件</option>
            </select>
            <div class="meta-right">
              全 <span id="contactTotalCount">0</span>件 <span id="contactRangeStart">0</span> - <span id="contactRangeEnd">0</span>
            </div>
          </div>
        </div>

        <div class="resizer-h" id="contact-resizer" role="separator" aria-orientation="horizontal" title="ドラッグで高さ調整" tabindex="0"></div>

        <div class="company-detail detail-tab-mode">
          <nav class="tabs-underline" role="tablist" aria-label="contact detail tabs">
              <button aria-selected="true" class="tab-btn active" data-contact-tab="detail" role="tab" type="button">担当者詳細</button>
              <button aria-selected="false" class="tab-btn" data-contact-tab="activities" role="tab" type="button">活動</button>
              <button aria-selected="false" class="tab-btn" data-contact-tab="projects" role="tab" type="button">案件</button>
            <div class="tab-actions">
              <button class="btn btn-orange" id="btnContactNewActivity" style="display: none;" type="button">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>
                新規活動
              </button>
              <button class="btn btn-orange" id="btnContactNewProject" style="display: none;" type="button">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>
                新規案件
              </button>
            </div>
          </nav>
          <div class="company-tabpanels">
            <section class="company-panel active" data-contact-panel="detail" role="tabpanel">
              <div class="panel-detail">
              <div class="panel-detail-body">
              <div class="detail-form">
                <!-- Left Column: Name & Contact Info -->
                <div class="form-col" style="flex: 1.2;" id="contactDetailCol1">
                  <div class="form-row">
                    <label>担当者ID</label>
                    <input id="contactDetailId" disabled type="text" />
                  </div>
                  <div class="form-row two">
                    <div class="sub">
                      <label>姓 <span class="req">*</span></label>
                      <input id="contactDetailLast" type="text" />
                    </div>
                    <div class="sub">
                      <label>名</label>
                      <input id="contactDetailFirst" type="text" />
                    </div>
                  </div>
                  <div class="form-row two">
                    <div class="sub">
                      <label>セイ</label>
                      <input id="contactDetailKana" type="text" />
                    </div>
                    <div class="sub">
                      <label>メイ</label>
                      <input type="text" />
                    </div>
                  </div>
                  <div class="form-row">
                    <label>会社名 <span class="req">*</span></label>
                    <div class="search-input-group">
                      <input id="mainContactCompanyName" type="text" value="旭川エレクトロニクスサービス株式会社" />
                      <button class="icon-btn-inline" id="btnMainContactLookupCompany" type="button">🔍</button>
                      <!-- (CP05) -->
                      <button class="btn btn-secondary" id="btnMainContactCreateCompany"
                        style="padding: 0 10px; color: #ff6600; border-color: #ff6600; width: 80px;"
                        type="button">新規</button>
                      <!-- (CP03) -->
                    </div>
                  </div>
                  <div class="form-row">
                    <label>部署名</label>
                    <input id="contactDetailDept" type="text" />
                  </div>
                  <div class="form-row two">
                    <div class="sub">
                      <label>TEL</label>
                      <input id="contactDetailTel" type="text" />
                    </div>
                    <div class="sub">
                      <label>内線</label>
                      <input id="contactDetailExt" type="text" />
                    </div>
                  </div>
                  <div class="form-row two">
                    <div class="sub">
                      <label>FA</label>
                      <input type="text" value="089-5996-4084" />
                    </div>
                    <div class="sub">
                      <label>携帯電話</label>
                      <input type="text" value="070-5532-1608" />
                    </div>
                  </div>
                  <div class="form-row">
                    <label>Email</label>
                    <input type="text" value="ishii.tomoya@c10141.co.jp" />
                  </div>
                  <div class="form-row">
                    <label>職種</label>
                    <select>
                      <option>生技開発</option>
                    </select>
                  </div>
                  <div class="form-row two">
                    <div class="sub">
                      <label>職位</label>
                      <select>
                        <option>次長・部長代理</option>
                      </select>
                    </div>
                    <div class="sub">
                      <label>役職名</label>
                      <input type="text" value="生産技術開発部次長" />
                    </div>
                  </div>
                  <div class="form-row">
                    <label></label>
                    <div class="check-group" >
                      <label class="check" style="width: fit-content;"><input type="checkbox" style="margin-left: 0;" /> 資料禁止</label>
                      <label class="check"><input type="checkbox" /> TEL禁止</label>
                      <label class="check"><input type="checkbox" /> TEL注意</label>
                    </div>
                  </div>
                </div>
                <!-- Middle Column: Remarks & Company Info -->
                <div class="form-row" style="flex:1;" id="contactDetailCol2">
                  <label>備考</label>
                  <textarea id="contactDetailRemark" style="min-height: 150px; flex: 1;">社内でのシステム導入プロジェクトに参画中。</textarea>
                </div>
                <div class="form-col" style="flex: 1.5;" id="contactDetailCol3">
                  <div class="form-row" style="margin-top: 15px;">
                    <label>フォロー予定</label>
                    <input type="date" />
                  </div>
                  <div class="form-row two">
                    <div class="sub">
                      <label>会社種別</label>
                      <input disabled="" type="text" value="その他" />
                    </div>
                    <div class="sub">
                      <label>代表TEL</label>
                      <input disabled="" type="text" value="077-589-2589" />
                    </div>
                  </div>
                  <div class="form-row two">
                    <div class="sub">
                      <label>業界</label>
                      <input disabled="" type="text" value="製造業" />
                    </div>
                    <div class="sub">
                      <label>規模ランク</label>
                      <input disabled="" type="text" value="1人～30人" />
                    </div>
                  </div>
                  <div class="form-row two">
                    <div class="sub">
                      <label>郵便番号</label>
                      <input disabled="" type="text" value="7059306" />
                    </div>
                    <div class="sub">
                      <label>都道府県</label>
                      <input disabled="" type="text" value="北海道" />
                    </div>
                  </div>
                  <div class="form-row">
                    <label>住所</label>
                    <input disabled="" type="text" value="北海道旭川市東区4丁目18-30" />
                  </div>
                  <div class="form-row two" style="margin-top: 15px;">
                    <div class="sub">
                      <label>作成日時</label>
                      <input disabled="" type="text" />
                    </div>
                    <div class="sub">
                      <label>作成者</label>
                      <input disabled="" type="text" />
                    </div>
                  </div>
                  <div class="form-row two">
                    <div class="sub">
                      <label>更新日時</label>
                      <input disabled="" type="text" />
                    </div>
                    <div class="sub">
                      <label>更新者</label>
                      <input disabled="" type="text" />
                    </div>
                  </div>
                </div>
                <!-- Right Column: Free fields -->
                <div class="form-col" style="flex: 0.8; padding-right: 16px;" id="contactDetailCol4">
                  <div class="form-row"><label>担当者自由使用欄1</label><input type="text" /></div>
                  <div class="form-row"><label>担当者自由使用欄2</label><input type="text" /></div>
                  <div class="form-row"><label>担当者自由使用欄3</label><input type="text" /></div>
                  <div class="form-row"><label>担当者自由使用欄4</label><input type="text" /></div>
                  <div class="form-row"><label>担当者自由使用欄5</label><input type="text" /></div>
                  <div class="form-row"><label>担当者自由使用欄6</label><input type="text" /></div>
                  <div class="form-row"><label>担当者自由使用欄7</label><input type="text" /></div>
</div>
              </div>
              </div>
              <div class="form-foot-split">
                <div class="left">
                  <button class="btn btn-danger" id="btnContactDelete" type="button">削除</button>
                </div>
                <div class="right">
                  <button class="btn btn-primary" id="btnContactSave" type="button">保存</button>
                </div>
              </div>
              </div>
            </section>
            <section class="company-panel" data-contact-panel="activities" role="tabpanel">
              <div class="tab-table-panel">
                <div class="table-wrap tab-table-wrap">
                  <div id="contactActivitiesList"></div>
                </div>
            <div class="pager-standalone tab-pager" id="contactActivitiesPager">
              <div class="pages">
                <button class="pg-btn" id="btnContactActivitiesFirstPage" type="button" title="最初へ">«</button>
                <button class="pg-btn" id="btnContactActivitiesPrevPage" type="button" title="前へ">‹</button>
                <div id="contactActivitiesPageNumbers" class="page-numbers" style="display:inline-flex;gap:3px;"></div>
                <button class="pg-btn" id="btnContactActivitiesNextPage" type="button" title="次へ">›</button>
                <button class="pg-btn" id="btnContactActivitiesLastPage" type="button" title="最後へ">»</button>
              </div>
              <div class="page-jump">
                <span>Page</span>
                <select id="contactActivitiesPageSelect" class="mini" aria-label="page select"></select>
                <span id="contactActivitiesPageTotal">/ 1</span>
              </div>
              <select id="contactActivitiesPageSize" class="pgsize-trigger" aria-label="page size">
                <option value="10" selected>10件</option>
                <option value="25">25件</option>
                <option value="50">50件</option>
                <option value="100">100件</option>
              </select>
              <div class="meta-right">
                全 <span id="contactActivitiesTotalCount">0</span>件 <span id="contactActivitiesRangeStart">0</span> - <span id="contactActivitiesRangeEnd">0</span>
              </div>
            </div>
              </div>
            </section>
            <section class="company-panel" data-contact-panel="projects" role="tabpanel">
              <div class="tab-table-panel">
                <div class="table-wrap tab-table-wrap">
                  <div id="contactProjectsList"></div>
                </div>
            <div class="pager-standalone tab-pager" id="contactProjectsPager">
              <div class="pages">
                <button class="pg-btn" id="btnContactProjectsFirstPage" type="button" title="最初へ">«</button>
                <button class="pg-btn" id="btnContactProjectsPrevPage" type="button" title="前へ">‹</button>
                <div id="contactProjectsPageNumbers" class="page-numbers" style="display:inline-flex;gap:3px;"></div>
                <button class="pg-btn" id="btnContactProjectsNextPage" type="button" title="次へ">›</button>
                <button class="pg-btn" id="btnContactProjectsLastPage" type="button" title="最後へ">»</button>
              </div>
              <div class="page-jump">
                <span>Page</span>
                <select id="contactProjectsPageSelect" class="mini" aria-label="page select"></select>
                <span id="contactProjectsPageTotal">/ 1</span>
              </div>
              <select id="contactProjectsPageSize" class="pgsize-trigger" aria-label="page size">
                <option value="10" selected>10件</option>
                <option value="25">25件</option>
                <option value="50">50件</option>
                <option value="100">100件</option>
              </select>
              <div class="meta-right">
                全 <span id="contactProjectsTotalCount">0</span>件 <span id="contactProjectsRangeStart">0</span> - <span id="contactProjectsRangeEnd">0</span>
              </div>
            </div>
              </div>
            </section>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- Shared Context Menu for Contact tables -->

    <div class="menu-icon-col">
      <span class="menu-icon">📋</span>
    </div>
    <div class="menu-label">コピー(C)</div>

  </div>
  <div class="menu-separator"></div>
  <div class="context-menu-item" data-action="new-contact">
    <div class="menu-icon-col"></div>
    <div class="menu-label">新規登録-担当者</div>

  </div>
  <div class="context-menu-item" data-action="new-activity">
    <div class="menu-icon-col"></div>

  </div>
  <div class="context-menu-item" data-action="new-project">
    <div class="menu-icon-col"></div>
    <div class="menu-label">新規登録-案件</div>

  </div>
</div>
