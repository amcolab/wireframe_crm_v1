<section class="section active" id="activity">
<div class="section-body" id="activity-root">
<div class="company-screen">
          <div class="search-header search-header--multi">
        <div class="screen-title">活動 <span class="code">(AT01)</span></div>
        <div class="field">
          <label for="activitySearchType">活動タイプ</label>
          <select id="activitySearchType" class="input" style="width:100px">
            <option value="">-</option>
            <option>TEL</option>
            <option>訪問</option>
            <option>メール</option>
          </select>
        </div>
        <div class="field">
          <label for="activitySearchSalesRep">営業担当</label>
          <input id="activitySearchSalesRep" class="input" type="text" style="width:min(140px,22vw)" />
        </div>
        <div class="field">
          <label for="activitySearchCompany">会社名</label>
          <input id="activitySearchCompany" class="input" type="text" style="width:min(160px,24vw)" />
        </div>
        <div class="field field-range">
          <label>活動日</label>
          <input id="activitySearchDateFrom" class="input" type="date" />
          <span class="range-sep">～</span>
          <input id="activitySearchDateTo" class="input" type="date" />
        </div>
        <button class="btn btn-secondary" id="btnActivitySearch" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg> 検索</button>
        <button class="btn btn-secondary" id="btnActivityAdvancedSearch" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg> 詳細検索</button>
        <button class="btn btn-secondary" id="btnActivityClear" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg> クリア</button>
        <div class="right">
          <button class="btn btn-secondary" id="btnActivityExport" type="button">エクスポート</button>
          <button class="btn btn-accent" id="btnActivityNewMain" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg> 新規活動</button>
        </div>
      </div>
      <div class="company-main">
        <!-- List Area -->
        <div class="list-stack">
          <div class="panel">
            <div class="company-table-wrap table-wrap">
              <table class="t" id="activityTable">
                <colgroup>
                  <col style="width:100px"><col style="width:80px"><col style="width:120px">
                  <col style="width:90px"><col style="width:220px"><col style="width:100px">
                  <col style="width:200px">
                </colgroup>
                <thead>
                  <tr>
                    <th data-col-key="date">活動日</th>
                    <th data-col-key="time">開始時刻</th>
                    <th data-col-key="rep">営業担当</th>
                    <th data-col-key="type">タイプ</th>
                    <th data-col-key="company">会社名</th>
                    <th data-col-key="contact">担当(姓)</th>
                    <th data-col-key="comment">コメント</th>
                  </tr>
                </thead>
                <tbody id="activityTableBody"></tbody>
              </table>
            </div>
          </div>
          <div class="pager-standalone">
            <div class="pages">
              <button class="pg-btn" id="btnActivityFirstPage" type="button" title="最初へ">«</button>
              <button class="pg-btn" id="btnActivityPrevPage" type="button" title="前へ">‹</button>
              <div id="activityPageNumbers" class="page-numbers" style="display:inline-flex;gap:3px;"></div>
              <button class="pg-btn" id="btnActivityNextPage" type="button" title="次へ">›</button>
              <button class="pg-btn" id="btnActivityLastPage" type="button" title="最後へ">»</button>
            </div>
            <div class="page-jump">
              <span>Page</span>
              <select id="activityPageSelect" class="mini" aria-label="page select"></select>
              <span id="activityPageTotal">/ 1</span>
            </div>
            <select id="activityPageSize" class="pgsize-trigger" aria-label="page size">
              <option value="10">10件</option>
              <option value="25">25件</option>
              <option value="50" selected>50件</option>
              <option value="100">100件</option>
            </select>
            <div class="meta-right">
              全 <span id="activityTotalCount">0</span>件 <span id="activityRangeStart">0</span> - <span id="activityRangeEnd">0</span>
            </div>
          </div>
        </div>

        <div class="resizer-h" id="activity-resizer" role="separator" aria-orientation="horizontal" title="ドラッグで高さ調整" tabindex="0"></div>

        <div class="company-detail detail-tab-mode">
          <div class="panel-detail">
            <div class="panel-detail-body">
              <div class="detail-form" style="grid-template-columns: 400px 400px 400px minmax(300px, 1fr); gap: 20px; min-width: 100%; width: max-content;">
              <!-- Col 1 -->
              <div class="form-col" id="activityDetailCol1">
                <div class="form-row">
                  <label>活動ID</label>
                  <input disabled id="atDetailId" type="text" value="29193" />
                </div>
                <div class="form-row two">
                  <div class="sub">
                    <label>活動タイプ <span class="req">*</span></label>
                    <select class="req-field-bg" id="atDetailType">
                      <option>TEL</option>
                    </select>
                  </div>
                  <div class="sub">
                    <label>目的</label>
                    <select id="atDetailPurpose">
                      <option>売り後フォロー</option>
                    </select>
                  </div>
                </div>
                <div class="form-row">
                  <label>動機</label>
                  <select id="atDetailMotivation">
                    <option>-</option>
                  </select>
                </div>
                <div class="form-row">
                  <label>担当者 <span class="req">*</span></label>
                  <div class="search-input-group" style="flex: 1;">
                    <input class="req-field-bg" id="atDetailContact" style="flex: 1;" type="text"
                      value="佐藤 瑞葵 [旭川エレクトロニクスサービス株式会社]" />
                    <button class="icon-btn-inline" id="btnAtDetailContactLookup" type="button">🔍</button>
                    <button class="btn btn-secondary" id="btnAtDetailContactNew"
                      style="padding: 0 10px; color: #ff6600; border-color: #ff6600; width: 60px;"
                      type="button">新規</button>
                  </div>
                </div>
                <div class="form-row">
                  <label>営業担当 <span class="req">*</span></label>
                  <select class="req-field-bg" id="atDetailSalesRep">
                    <option>中谷 太輔 [企画部]</option>
                  </select>
                </div>
                <div class="form-row two">
                  <div class="sub">
                    <label>案件ID</label>
                    <input id="atDetailProjectId" type="text" />
                  </div>
                  <div class="sub">
                    <label>リードID</label>
                    <input id="atDetailLeadId" type="text" />
                  </div>
                </div>
                <div class="form-row">
                  <label>案件名</label>
                  <div class="search-input-group" style="flex: 1;">
                    <input id="atDetailProjectName" style="flex: 1;" type="text" />
                    <button class="icon-btn-inline" id="btnAtDetailProjectLookup" type="button">🔍</button>
                    <button class="btn btn-secondary" id="btnAtDetailProjectNew"
                      style="padding: 0 10px; color: #ff6600; border-color: #ff6600; width: 60px;"
                      type="button">新規</button>
                  </div>
                </div>
                <div class="form-row">
                  <label>活動日</label>
                  <input id="atDetailDate" type="date" value="2026-04-29" />
                </div>
                <div class="form-row two">
                  <div class="sub">
                    <label>開始時刻</label>
                    <select id="atDetailStartTime">
                      <option>10:15</option>
                    </select>
                  </div>
                  <div class="sub">
                    <label>終了時刻</label>
                    <select id="atDetailEndTime">
                      <option>-</option>
                    </select>
                  </div>
                </div>
                <div class="form-row two">
                  <div class="sub">
                    <label>活動時間</label>
                    <input disabled id="atDetailDuration" type="text" />
                  </div>
                  <div class="sub">
                    <label>面談人数</label>
                    <input id="atDetailAttendees" type="number" />
                  </div>
                </div>
                <div class="form-row" style="padding-top: 10px;">
                  <label></label>
                  <div>
                    <label class="check"><input id="atDetailFollowCompleted" type="checkbox" style="margin-left: 0px;" /> フォロー完了</label>
                    <label class="check"><input id="atDetailHasAppt" type="checkbox" /> アポ有</label>
                    <label class="check"><input id="atDetailIsClaim" type="checkbox" /> クレーム</label>
                  </div>
                </div>
              </div>
              <!-- Col 2 -->
              <div class="form-col" id="activityDetailCol2" style="height: 100%;">
                <div class="form-row form-row--remark" style="height: 100%;">
                  <label>コメント</label>
                  <textarea id="atDetailComment" class="input" rows="4" style="flex: 1; min-height: 100%;">wwww</textarea>
                </div>
              </div>
              <!-- Col 3 -->
              <div class="form-col" id="activityDetailCol3">
                <div class="form-row">
                  <label>会社名</label>
                  <div style="display:flex; gap:8px; flex:1;">
                    <input disabled id="atDetailCompanyId" style="width: 80px;" type="text" value="1141" />
                    <input disabled id="atDetailCompanyName" style="flex:1" type="text"
                      value="旭川エレクトロニクスサービス株式会社" />
                  </div>
                </div>
                <div class="form-row two">
                  <div class="sub">
                    <label>会社種別</label>
                    <select disabled id="atDetailCompanyType">
                      <option>その他</option>
                    </select>
                  </div>
                  <div class="sub">
                    <label>代表TEL</label>
                    <input disabled id="atDetailCompanyTel" type="text" value="077-589-2569" />
                  </div>
                </div>
                <div class="form-row two">
                  <div class="sub">
                    <label>業界</label>
                    <select disabled id="atDetailIndustry">
                      <option>製造業</option>
                    </select>
                  </div>
                  <div class="sub">
                    <label>規模ランク</label>
                    <select disabled id="atDetailScale">
                      <option>1人～30人</option>
                    </select>
                  </div>
                </div>
                <div class="form-row">
                  <label>部署名</label>
                  <input disabled id="atDetailDept" type="text" value="クオリティアシュアランス部" />
                </div>
                <div class="form-row two">
                  <div class="sub">
                    <label>郵便番号</label>
                    <input disabled id="atDetailPostal" type="text" value="7059306" />
                  </div>
                  <div class="sub">
                    <label>都道府県</label>
                    <select disabled id="atDetailPref">
                      <option>北海道</option>
                    </select>
                  </div>
                </div>
                <div class="form-row">
                  <label>住所</label>
                  <input disabled id="atDetailAddress" type="text" value="北海道市東区4丁目18-30" />
                </div>
                <div class="detail-audit">
                  <div class="form-row two">
                    <div class="sub">
                      <label>作成日時</label>
                      <input disabled id="atDetailCreatedAt" type="text" value="2026/04/29" />
                    </div>
                    <div class="sub">
                      <label>作成者</label>
                      <input disabled id="atDetailCreatedBy" type="text" value="中谷 太輔" />
                    </div>
                  </div>
                  <div class="form-row two" style="margin-top: 10px;">
                    <div class="sub">
                      <label>更新日時</label>
                      <input disabled id="atDetailUpdatedAt" type="text" />
                    </div>
                    <div class="sub">
                      <label>更新者</label>
                      <input disabled id="atDetailUpdatedBy" type="text" />
                    </div>
                  </div>
                </div>
              </div>
              <!-- Col 4 -->
              <div class="form-col" id="activityDetailCol4">
                <div class="form-row">
                  <label>活動自由使用欄1</label>
                  <input id="atDetailFree1" type="text" />
                </div>
                <div class="form-row">
                  <label>活動自由使用欄2</label>
                  <input id="atDetailFree2" type="text" />
                </div>
                <div class="form-row">
                  <label>活動自由使用欄3</label>
                  <input id="atDetailFree3" type="text" />
                </div>
                <div class="form-row">
                  <label>活動自由使用欄4</label>
                  <input id="atDetailFree4" type="text" />
                </div>
                <div class="form-row">
                  <label>活動自由使用欄5</label>
                  <input id="atDetailFree5" type="text" />
                </div>
                <div class="form-row">
                  <label>活動自由使用欄6</label>
                  <input id="atDetailFree6" type="text" />
                </div>
                <div class="form-row">
                  <label>活動自由使用欄7</label>
                  <input id="atDetailFree7" type="text" />
                </div>
                <div class="form-row attach-field">
                  <label>添付資料</label>
                  <div class="attach-box attach-box--compact" style="flex: 1;">ここにドラッグ＆ドロップ</div>
                </div>
              </div>
              </div>
            </div>
            <div class="form-foot-split">
                <div class="left">
                  <button class="btn btn-danger" id="btnAtDetailDelete" type="button">削除</button>
                </div>
                <div class="right">
                  <button class="btn btn-primary" id="btnAtDetailSave" type="button">保存</button>
                </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<div id="activityContextMenu" class="custom-context-menu" style="display: none;" role="menu" aria-hidden="true">
  <div class="context-menu-item" data-action="copy" role="menuitem">
    <div class="menu-icon-col"><span class="menu-icon">📋</span></div>
    <div class="menu-label">コピー(C)</div>
    <div class="menu-shortcut"></div>
  </div>
  <div class="context-menu-item disabled" data-action="paste" role="menuitem">
    <div class="menu-icon-col"></div>
    <div class="menu-label">貼り付け(P)</div>
    <div class="menu-shortcut">Ctrl+V</div>
  </div>
  <div class="menu-separator"></div>
  <div class="context-menu-item" data-action="new-activity" role="menuitem">
    <div class="menu-icon-col"></div>
    <div class="menu-label">新規登録-活動</div>
    <div class="menu-shortcut"></div>
  </div>
</div>
