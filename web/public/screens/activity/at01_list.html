<section class="section active" id="activity">

<div style="display: flex; align-items: center; gap: 5px;">
<label class="company-search-label">活動タイプ</label>
<select id="activitySearchType" style="width: 100px;">
<option value="">-</option>
<option>TEL</option>
<option>訪問</option>
<option>メール</option>
</select>
</div>
<div style="display: flex; align-items: center; gap: 5px;">
<label class="company-search-label">営業担当</label>
<input id="activitySearchSalesRep" style="width: 120px;" type="text"/>
</div>
<div style="display: flex; align-items: center; gap: 5px;">
<label class="company-search-label">会社名</label>
<input id="activitySearchCompany" style="width: 120px;" type="text"/>
</div>
<div style="display: flex; align-items: center; gap: 5px;">
<label class="company-search-label">活動日</label>
<input id="activitySearchDateFrom" style="width: 130px;" type="date"/>
<span>～</span>
<input id="activitySearchDateTo" style="width: 130px;" type="date"/>
</div>
      </div>
    </div>
    <div class="company-topbar-right">
        <button class="btn btn-secondary" id="btnActivitySearch">🔍 検索</button>

        <button class="btn btn-secondary" id="btnActivityClear">✕ クリア</button>

      <div class="company-main">

        <div class="company-grid">
          <div class="company-table-wrap">
            <div id="activityTable"></div>
          </div>
          <div class="company-grid-footer">
            <div class="footer-left">
              <div class="company-grid-pager">
                <button class="icon-btn" id="btnActivityFirstPage" title="First Page">«</button>
                <button class="icon-btn" id="btnActivityPrevPage" title="Previous Page">‹</button>
                <div id="activityPageNumbers" class="page-numbers"></div>
                <button class="icon-btn" id="btnActivityNextPage" title="Next Page">›</button>
                <button class="icon-btn" id="btnActivityLastPage" title="Last Page">»</button>

                <div class="pager-jump">
                  Page
                  <select id="activityPageSelect" class="mini-select" aria-label="page select"></select>
                  <span id="activityPageTotal" style="width: 50px;">/ 1</span>
                </div>

                <select id="activityPageSize" class="mini-select" aria-label="page size">
                  <option value="10">10件</option>
                  <option value="25" selected>25件</option>
                  <option value="50">50件</option>
                  <option value="100">100件</option>
                </select>
              </div>
            </div>
            <div class="footer-right">
              <div class="company-grid-meta">
                全 <span id="activityTotalCount">0</span> 件
                <span class="range-info"><span id="activityRangeStart">0</span> - <span id="activityRangeEnd">0</span></span>
              </div>
            </div>
          </div>
