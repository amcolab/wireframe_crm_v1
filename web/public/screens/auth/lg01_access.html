<section id="access-code-screen" class="screen active auth-bg">
  <main class="auth-card" role="main">
    <header class="auth-brand">
      <div class="auth-brand-mark">S</div>
      <div class="auth-brand-name">SMOS</div>
      <div class="spacer"></div>
      <span class="code">Access v2.6.0</span>
    </header>

    <section class="auth-body">
      <h1 class="auth-title">アクセス認証</h1>
      <p class="auth-sub">承認コードを入力してください (LG01)</p>

      <div class="alert-error" id="accessError" role="alert">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v5"/><path d="M12 16h.01"/></svg>
        <span>アクセスコードが正しくありません。</span>
      </div>

      <div class="form-4col cols-1 density-roomy auth-form">
        <div class="ff">
          <label for="access-code">アクセスコード <span class="req">*</span></label>
          <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input class="input access-code-input" type="text" id="access-code" placeholder="000-000" required>
        </div>

        <button id="btn-submit-code" class="btn btn-primary btn-block">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="m10 17 5-5-5-5"/><path d="M15 12H3"/></svg>
          送信
        </button>
      </div>

      <div class="auth-helper-text">
        コードをお持ちでない場合は管理者にお問い合わせください。
      </div>
    </section>
  </main>
</section>
