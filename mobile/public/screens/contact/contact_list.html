<div class="search-container">
    <div class="search-input-wrapper">
        <i data-lucide="search"></i>
        <input type="text" class="search-input" placeholder="担当者を探す" id="contact-search">
    </div>
    <div class="filter-btn">
        <i data-lucide="sliders-horizontal"></i>
    </div>
</div>

<div class="activity-list" id="contact-items-container">
    <!-- Contact items will be injected here -->
</div>

<!-- Advanced Search Modal -->
<div id="advanced-search-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
        <div class="modal-header">
            <h3>担当者検索</h3>
            <button class="close-modal-btn" id="close-advanced-search">
                <i data-lucide="x"></i>
            </button>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <label>担当者名</label>
                <input type="text" id="adv-contact-name" class="form-input" placeholder="氏名を入力">
            </div>
            <div class="form-group">
                <label>会社名</label>
                <input type="text" id="adv-contact-company" class="form-input" placeholder="会社名を入力">
            </div>
            <div class="form-group">
                <label>役職名</label>
                <input type="text" id="adv-contact-role" class="form-input" placeholder="役職名を入力">
            </div>
            <div class="form-group">
                <label>携帯番号</label>
                <input type="text" id="adv-contact-mobile" class="form-input" placeholder="携帯番号を入力">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="text" id="adv-contact-email" class="form-input" placeholder="Emailを入力">
            </div>
            <div class="form-group" style="flex-direction: row; align-items: center; gap: 10px;">
                <input type="checkbox" id="adv-contact-longtime" style="width: 20px; height: 20px;">
                <label for="adv-contact-longtime" style="font-size: 13px;">ご無沙汰検索 (6ヶ月以上活動なし)</label>
            </div>
        </div>
        <div class="modal-footer">
            <button id="apply-advanced-search" class="login-btn" style="margin-top: 0;">検索する</button>
        </div>
    </div>
</div>
