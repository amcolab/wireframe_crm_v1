<div class="page-inner scan-page">
  <section class="form-section scan-form-section">
    <header class="scan-card-head">
      <h2 class="scan-card-title">スキャン結果</h2>
      <!-- <p class="scan-card-desc">OCR内容を確認して登録してください</p> -->
    </header>
    <div class="form-body scan-rows">
      <div class="scan-row">
        <label for="scan-name">担当者</label>
        <input type="text" id="scan-name" class="form-control" value="中谷 太輔">
      </div>
      <div class="scan-row">
        <label for="scan-company">登録先会社</label>
        <select id="scan-company" class="form-control" required>
          <option value="">選択してください</option>
        </select>
      </div>
      <div class="scan-row scan-row-hint">
        <span class="scan-row-hint-spacer" aria-hidden="true"></span>
        <p class="scan-ocr-hint" id="scan-ocr-company">名刺読取: 株式会社ボウルズ</p>
      </div>
      <div class="scan-row">
        <label for="scan-dept">部署</label>
        <input type="text" id="scan-dept" class="form-control" value="営業企画部">
      </div>
      <div class="scan-row">
        <label for="scan-email">メール</label>
        <input type="email" id="scan-email" class="form-control" value="nakatani@bowls.co.jp">
      </div>
      <div class="scan-row">
        <label for="scan-tel">会社電話</label>
        <input type="tel" id="scan-tel" class="form-control" value="06-6210-2765">
      </div>
      <div class="scan-row">
        <label for="scan-fax">会社FAX</label>
        <input type="tel" id="scan-fax" class="form-control" value="06-6210-2766">
      </div>
      <div class="scan-row">
        <label for="scan-mobile">携帯</label>
        <input type="tel" id="scan-mobile" class="form-control" value="080-1234-5678">
      </div>
      <div class="scan-row">
        <label for="scan-postal">郵便番号</label>
        <input type="text" id="scan-postal" class="form-control" value="542-0081">
      </div>
      <div class="scan-row scan-row-addr">
        <label for="scan-addr">住所</label>
        <input type="text" id="scan-addr" class="form-control" value="大阪市中央区南船場 4-12-8 関西心斎橋ビル 804">
      </div>
    </div>
  </section>

  <div class="scan-actions-wrap">
    <div class="scan-actions-card">
      <button type="button" class="btn btn-outline scan-retake-btn" id="btn-retake-scan">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        撮り直す
      </button>
      <div class="save-bar scan-save-bar">
        <button type="button" class="btn btn-secondary" id="btn-clear-scan">クリア</button>
        <button type="button" class="btn btn-primary accent" id="btn-register-scan">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg>
          登録する
        </button>
      </div>
    </div>
  </div>
</div>

<div id="scan-register-modal" class="modal-overlay modal-overlay--dialog" style="display: none;" role="dialog" aria-modal="true" aria-labelledby="scan-register-modal-title">
  <div class="modal-content modal-content--dialog">
    <div class="modal-header">
      <h3 id="scan-register-modal-title">登録完了</h3>
      <button type="button" class="close-modal-btn" id="close-scan-register-modal" aria-label="閉じる">
        <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg></span>
      </button>
    </div>
    <div class="modal-body scan-register-modal-body">
      <p class="scan-register-message" id="scan-register-message">「中谷 太輔」を株式会社ボウルズに登録しました。</p>
      <p class="scan-register-hint">次の操作を選んでください。</p>
    </div>
    <div class="modal-footer scan-register-modal-footer">
      <button type="button" class="btn btn-secondary btn-block" id="btn-scan-modal-home">ホームへ</button>
      <button type="button" class="btn btn-primary accent btn-block" id="btn-scan-modal-continue">続けて撮影</button>
    </div>
  </div>
</div>
