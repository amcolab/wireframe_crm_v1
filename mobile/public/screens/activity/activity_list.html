<div class="page-shell page-shell--fab">
    <div class="page-inner page-list-with-action">
        <div class="search-bar">
            <div class="search-input">
                <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></span>
                <input type="text" placeholder="会社・担当者で検索" id="activity-search">
            </div>
            <button type="button" class="filter-btn" aria-label="詳細検索">
                <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M6 12h12M10 18h4"/></svg></span>
                <span class="dot"></span>
            </button>
        </div>

        <div class="list-meta"><span class="total"><b id="activity-count">0</b>件</span></div>
        <div class="list activity-list-body" id="activity-items-container"></div>
    </div>

    <div class="page-fab-dock" aria-label="活動登録">
        <button type="button" class="btn btn-primary accent btn-register-activity" id="btn-new-activity">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            活動を登録する
        </button>
    </div>
</div>

<div id="advanced-search-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
        <div class="modal-header">
            <h3>活動詳細検索</h3>
            <button type="button" class="close-modal-btn" id="close-advanced-search" aria-label="閉じる">
                <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg></span>
            </button>
        </div>
        <div class="modal-body">
            <div><label>会社名</label><input type="text" id="adv-activity-company" class="form-input" placeholder="会社名を入力"></div>
            <div><label>活動タイプ</label>
                <select id="adv-activity-type" class="form-input">
                    <option value="">すべて</option>
                    <option>電話</option>
                    <option>メール</option>
                    <option>訪問</option>
                    <option>WEB商談</option>
                </select>
            </div>
            <div><label>営業担当</label><input type="text" id="adv-activity-salesrep" class="form-input" placeholder="営業担当者名を入力"></div>
            <div><label>活動日 (開始)</label><input type="date" id="adv-activity-date-from" class="form-input"></div>
            <div><label>活動日 (終了)</label><input type="date" id="adv-activity-date-to" class="form-input"></div>
        </div>
        <div class="modal-footer">
            <button type="button" id="apply-advanced-search" class="btn-block">検索する</button>
        </div>
    </div>
</div>
