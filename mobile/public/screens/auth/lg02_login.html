<div class="auth-screen">
  <main class="auth-card" role="main">
    <header class="auth-brand">
      <div class="auth-brand-mark">S</div>
      <div class="auth-brand-name">SMOS</div>
      <div class="spacer"></div>
      <span class="code">Mobile v2.4.0</span>
    </header>
    <section class="auth-body-inner">
      <h1 class="auth-title">ログイン</h1>
      <p class="auth-sub">アカウント情報を入力してください</p>
      <div class="form-field">
        <label for="username">ログイン名 <span class="req">*</span></label>
        <input type="text" id="username" placeholder="ユーザー名" autocomplete="username" autofocus>
      </div>
      <div class="form-field">
        <label for="password">パスワード <span class="req">*</span></label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
      </div>
      <button type="button" id="btn-login" class="btn-block">ログイン</button>
    </section>
    <footer class="auth-footer">© 2026 SMOS 管理</footer>
  </main>
</div>
