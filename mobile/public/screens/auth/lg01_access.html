<div class="auth-screen">
  <main class="auth-card" role="main">
    <header class="auth-brand">
      <div class="auth-brand-mark">S</div>
      <div class="auth-brand-name">SMOS</div>
      <div class="spacer"></div>
      <span class="code">Mobile v2.4.0</span>
    </header>
    <section class="auth-body-inner">
      <h1 class="auth-title">承認コード</h1>
      <p class="auth-sub">承認コードを入力してください</p>
      <div class="form-field">
        <label for="access-code">承認コード <span class="req">*</span></label>
        <input type="text" id="access-code" placeholder="0000" maxlength="4" autofocus>
      </div>
      <button type="button" id="btn-submit-code" class="btn-block">承認する</button>
    </section>
    <footer class="auth-footer">© 2026 SMOS</footer>
  </main>
</div>
