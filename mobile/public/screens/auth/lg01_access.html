<div class="auth-screen">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-logo">
                <svg viewBox="0 0 100 100" class="logo-svg">
                    <path d="M50 5 L90 25 L90 75 L50 95 L10 75 L10 25 Z" fill="none" stroke="currentColor" stroke-width="4" />
                    <path d="M50 5 L50 95 M90 25 L10 75 M10 25 L90 75" fill="none" stroke="currentColor" stroke-width="2" opacity="0.3" />
                </svg>
            </div>
            <h1>SMOS</h1>
            <p>承認が必要です</p>
        </div>

        <div class="auth-body">

                <label for="access-code">承認コードを入力してください</label>

                    <input type="text" id="access-code" placeholder="0000" maxlength="4" autofocus>

            <button id="btn-submit-code" class="auth-btn">承認する</button>
        </div>
        
        <div class="auth-footer">
            <p>バージョン 2.4.0</p>
