<div class="page-inner detail-page">
  <div class="detail-tab-panel" id="company-tab-detail" data-tab-panel="detail">
    <section class="section">
      <div class="section-head"><h3>基本情報</h3></div>
      <div class="fields">
        <div class="field-row"><span class="k">会社名</span><span class="v" id="company-name-field">-</span></div>
        <div class="field-row"><span class="k">会社ID</span><span class="v mono" id="company-id">-</span></div>
        <div class="field-row"><span class="k">代表TEL</span><span class="v link mono" id="company-tel">-</span></div>
        <div class="field-row"><span class="k">代表FAX</span><span class="v mono" id="company-fax">-</span></div>
        <div class="field-row"><span class="k">地区</span><span class="v" id="company-district-wrap">-</span></div>
        <div class="field-row"><span class="k">郵便番号</span><span class="v mono" id="company-postal">-</span></div>
        <div class="field-row"><span class="k">都道府県</span><span class="v" id="company-pref">-</span></div>
        <div class="field-row full"><span class="k">住所</span><span class="v" id="company-addr">-</span></div>
      </div>
    </section>

    <section class="section">
      <div class="section-head"><h3>業種・規模</h3></div>
      <div class="fields">
        <div class="field-row"><span class="k">業界</span><span class="v" id="company-industryGroup">-</span></div>
        <div class="field-row"><span class="k">業種</span><span class="v" id="company-industry">-</span></div>
        <div class="field-row"><span class="k">規模ランク</span><span class="v" id="company-scale-wrap">-</span></div>
        <div class="field-row"><span class="k">会社種別</span><span class="v" id="company-type">-</span></div>
        <div class="field-row"><span class="k">従業員数</span><span class="v" id="company-employees">-</span></div>
        <div class="field-row"><span class="k">資本金</span><span class="v" id="company-capital">-</span></div>
      </div>
    </section>

    <div class="memo-card">
      <div class="memo-head"><h3>備考</h3></div>
      <div class="memo-body"><textarea id="company-memo" placeholder="ここにメモを入力してください..."></textarea></div>
    </div>

    <section class="section">
      <div class="section-head"><h3>会社自由使用欄</h3><span class="meta">1〜5</span></div>
      <div class="free-list">
        <div class="free-row"><span class="k">使用欄 1</span><span class="v" id="company-free1">-</span></div>
        <div class="free-row"><span class="k">使用欄 2</span><span class="v" id="company-free2">-</span></div>
        <div class="free-row"><span class="k">使用欄 3</span><span class="v" id="company-free3">-</span></div>
        <div class="free-row"><span class="k">使用欄 4</span><span class="v" id="company-free4">-</span></div>
        <div class="free-row"><span class="k">使用欄 5</span><span class="v" id="company-free5">-</span></div>
      </div>
    </section>

    <section class="section">
      <div class="section-head">
        <h3>担当者</h3>
        <button type="button" class="btn-link" id="company-related-contacts-all" hidden>すべて表示</button>
      </div>
      <div id="company-related-contacts" class="rel-list"></div>
    </section>

    <section class="section">
      <div class="section-head">
        <h3>活動</h3>
        <button type="button" class="btn-link" id="company-related-activities-all" hidden>すべて表示</button>
      </div>
      <div id="company-related-activities" class="rel-list"></div>
    </section>

    <section class="section">
      <div class="section-head">
        <h3>案件</h3>
        <button type="button" class="btn-link" id="company-related-projects-all" hidden>すべて表示</button>
      </div>
      <div id="company-related-projects" class="rel-list"></div>
    </section>
  </div>

  <div class="detail-tab-panel" id="company-tab-contacts" data-tab-panel="contacts" hidden>
    <section class="section">
      <div class="section-head"><h3>担当者</h3></div>
      <div id="company-contacts-list"></div>
    </section>
  </div>

  <div class="detail-tab-panel" id="company-tab-activity" data-tab-panel="activity" hidden>
    <section class="section">
      <div class="section-head"><h3>活動</h3></div>
      <p class="empty-hint" style="padding:12px">関連活動は活動一覧から確認できます（wireframe）</p>
    </section>
  </div>

  <div class="detail-tab-panel" id="company-tab-project" data-tab-panel="project" hidden>
    <section class="section">
      <div class="section-head"><h3>案件</h3></div>
      <p class="empty-hint" style="padding:12px">関連案件は案件一覧から確認できます（wireframe）</p>
    </section>
  </div>
</div>
