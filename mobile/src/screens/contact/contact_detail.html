<div class="detail-container">
    <section class="detail-section">
        <div class="detail-header">
            <i data-lucide="user"></i>
            <h2>担当者</h2>
        </div>
        <div class="detail-grid">
            <div class="detail-field field-full">
                <div class="field-label">担当者名</div>
                <div class="field-value" id="contact-name" style="font-size: 18px; font-weight: 700;">-</div>
            </div>
            <div class="detail-field">
                <div class="field-label">代表TEL</div>
                <div class="field-value" id="contact-tel">-</div>
            </div>
            <div class="detail-field">
                <div class="field-label">FAX</div>
                <div class="field-value" id="contact-fax">-</div>
            </div>
            <div class="detail-field">
                <div class="field-label">携帯</div>
                <div class="field-value" id="contact-mobile">-</div>
            </div>
            <div class="detail-field">
                <div class="field-label">メール</div>
                <div class="field-value" id="contact-email">-</div>
            </div>
            <div class="detail-field">
                <div class="field-label">代表TEL (再掲)</div>
                <div class="field-value" id="contact-tel2">-</div>
            </div>
            <div class="detail-field">
                <div class="field-label">職種</div>
                <div class="field-value" id="contact-job-category">-</div>
            </div>
            <div class="detail-field">
                <div class="field-label">職位</div>
                <div class="field-value" id="contact-position">-</div>
            </div>
            <div class="detail-field">
                <div class="field-label">役職名</div>
                <div class="field-value" id="contact-role">-</div>
            </div>
        </div>
    </section>

    <section class="detail-section">
        <div class="field-label" style="margin-bottom: 8px;">メモ</div>
        <textarea class="memo-textarea" id="contact-memo" placeholder="ここにメモを入力してください..."></textarea>
    </section>

    <section class="detail-section">
        <div class="detail-grid">
            <div class="detail-field">
                <div class="field-label">担当者自由使用欄 1</div>
                <div class="field-value" id="contact-free1">-</div>
            </div>
            <div class="detail-field">
                <div class="field-label">担当者自由使用欄 2</div>
                <div class="field-value" id="contact-free2">-</div>
            </div>
            <div class="detail-field">
                <div class="field-label">担当者自由使用欄 3</div>
                <div class="field-value" id="contact-free3">-</div>
            </div>
            <div class="detail-field">
                <div class="field-label">担当者自由使用欄 4</div>
                <div class="field-value" id="contact-free4">-</div>
            </div>
            <div class="detail-field">
                <div class="field-label">担当者自由使用欄 5</div>
                <div class="field-value" id="contact-free5">-</div>
            </div>
        </div>
    </section>

    <!-- Company Section in Contact Detail -->
    <section class="detail-section" style="border: 1px solid var(--border-color); border-radius: 8px; margin: 0 16px 24px;">
        <div class="detail-header" style="border-bottom: none; margin-bottom: 8px;">
            <i data-lucide="building-2"></i>
            <h2>会社</h2>
        </div>
        <div class="detail-grid" style="padding: 0 4px 8px;">
            <div class="detail-field field-full">
                <div class="field-label">会社名</div>
                <div class="field-value" id="contact-company-name" style="font-weight: 700;">-</div>
            </div>
            <div class="detail-field">
                <div class="field-label">郵便番号</div>
                <div class="field-value" id="contact-company-postal">-</div>
            </div>
            <div class="detail-field">
                <div class="field-label">都道府県</div>
                <div class="field-value" id="contact-company-pref">-</div>
            </div>
            <div class="detail-field field-full">
                <div class="field-label">住所</div>
                <div class="field-value" id="contact-company-addr">-</div>
            </div>
            <div class="detail-field">
                <div class="field-label">代表TEL</div>
                <div class="field-value" id="contact-company-tel">-</div>
            </div>
        </div>
    </section>
</div>
