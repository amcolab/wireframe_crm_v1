<div class="search-container">
    <div class="search-input-wrapper">
        <i data-lucide="search"></i>
        <input type="text" class="search-input" placeholder="案件を探す" id="project-search">
    </div>
    <div class="filter-btn">
        <i data-lucide="sliders-horizontal"></i>
    </div>
</div>

<div class="activity-list" id="project-items-container">
    <!-- Project items will be injected here -->
</div>

<!-- Advanced Search Modal -->
<div id="advanced-search-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
        <div class="modal-header">
            <h3>案件詳細検索</h3>
            <button class="close-modal-btn" id="close-advanced-search">
                <i data-lucide="x"></i>
            </button>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <label>会社名</label>
                <input type="text" id="adv-project-company" class="form-input" placeholder="会社名を入力">
            </div>
            <div class="form-group">
                <label>ステータス</label>
                <select id="adv-project-status" class="form-input">
                    <option value="">すべて</option>
                    <option>話題</option>
                    <option>引合</option>
                    <option>見積</option>
                    <option>提案</option>
                    <option>受注</option>
                    <option>失注</option>
                </select>
            </div>
            <div class="form-group">
                <label>営業担当</label>
                <input type="text" id="adv-project-salesrep" class="form-input" placeholder="営業担当者名を入力">
            </div>
            <div class="form-group">
                <label>話題日 (開始)</label>
                <input type="date" id="adv-project-date-from" class="form-input">
            </div>
            <div class="form-group">
                <label>話題日 (終了)</label>
                <input type="date" id="adv-project-date-to" class="form-input">
            </div>
        </div>
        <div class="modal-footer">
            <button id="apply-advanced-search" class="login-btn" style="margin-top: 0;">検索する</button>
        </div>
    </div>
</div>
