<div class="home-container" style="padding: 24px 16px; background-color: var(--bg-color); min-height: 100%;">
    <div class="quick-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
        <div class="quick-tile" onclick="window.location.hash='company'">
            <i data-lucide="building-2"></i>
            <span>会社</span>
        </div>
        <div class="quick-tile" onclick="window.location.hash='contact'">
            <i data-lucide="user"></i>
            <span>担当者</span>
        </div>
        <div class="quick-tile" onclick="window.location.hash='activity'">
            <i data-lucide="briefcase"></i>
            <span>活動</span>
        </div>
        <div class="quick-tile" onclick="window.location.hash='project'">
            <i data-lucide="handshake"></i>
            <span>案件</span>
        </div>
        <div class="quick-tile" onclick="alert('名刺スキャン機能は開発中です')">
            <i data-lucide="camera"></i>
            <span>名刺スキャン</span>
        </div>
        <div class="quick-tile logout-tile" id="logout-tile">
            <i data-lucide="log-out"></i>
            <span>ログアウト</span>
        </div>
    </div>
</div>
