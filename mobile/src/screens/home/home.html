<div class="home-container">
    <header class="home-hero">
        <div class="hero-content">
            <h1>SMOS Mobile</h1>
            <p>こんにちは、管理者さん</p>
        </div>
        <div class="hero-stats">
            <div class="stat-item">
                <span class="stat-value">12</span>
                <span class="stat-label">本日の活動</span>
            </div>
            <div class="stat-item">
                <span class="stat-value">5</span>
                <span class="stat-label">進行中の案件</span>
            </div>
        </div>
    </header>

    <div class="home-sections">
        <h3 class="section-title">クイックメニュー</h3>
        <div class="quick-grid">
            <div class="quick-card" onclick="window.location.hash='activity'">
                <div class="icon-box activity"><i data-lucide="briefcase"></i></div>
                <span>活動</span>
            </div>
            <div class="quick-card" onclick="window.location.hash='company'">
                <div class="icon-box company"><i data-lucide="building-2"></i></div>
                <span>会社</span>
            </div>
            <div class="quick-card" onclick="window.location.hash='contact'">
                <div class="icon-box contact"><i data-lucide="users"></i></div>
                <span>担当者</span>
            </div>
            <div class="quick-card" onclick="window.location.hash='project'">
                <div class="icon-box project"><i data-lucide="handshake"></i></div>
                <span>案件</span>
            </div>
        </div>

        <h3 class="section-title" style="margin-top: 24px;">最近の更新</h3>
        <div class="recent-list">
            <div class="recent-item">
                <div class="recent-info">
                    <div class="recent-title">イオンリテール株式会社</div>
                    <div class="recent-meta">活動更新 · 10分前</div>
                </div>
                <i data-lucide="chevron-right"></i>
            </div>
            <div class="recent-item">
                <div class="recent-info">
                    <div class="recent-title">金型更新プロジェクト</div>
                    <div class="recent-meta">ステータス変更 · 1時間前</div>
                </div>
                <i data-lucide="chevron-right"></i>
            </div>
        </div>

        <button id="logout-btn" class="logout-btn-premium">
            <i data-lucide="log-out"></i>
            <span>ログアウト</span>
        </button>
    </div>
</div>

<script type="module">
    if (window.lucide) window.lucide.createIcons();
    document.getElementById('logout-btn')?.addEventListener('click', () => {
        localStorage.removeItem('smos_auth');
        window.location.hash = 'login';
    });
</script>
