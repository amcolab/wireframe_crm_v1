<div class="auth-screen">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-logo">
                <svg viewBox="0 0 100 100" class="logo-svg">
                    <path d="M50 5 L90 25 L90 75 L50 95 L10 75 L10 25 Z" fill="none" stroke="currentColor" stroke-width="4" />
                    <path d="M50 5 L50 95 M90 25 L10 75 M10 25 L90 75" fill="none" stroke="currentColor" stroke-width="2" opacity="0.3" />
                </svg>
            </div>
            <h1>SMOS</h1>
            <p>ユーザー認証</p>
        </div>

        <div class="auth-body">
            <div class="form-group">
                <label for="username">ログイン名</label>
                <div class="input-wrapper">
                    <input type="text" id="username" placeholder="ユーザー名" autofocus>
                </div>
            </div>
            <div class="form-group">
                <label for="password">パスワード</label>
                <div class="input-wrapper">
                    <input type="password" id="password" placeholder="••••••••">
                </div>
            </div>
            <button id="btn-login" class="auth-btn">ログイン</button>
        </div>
        
        <div class="auth-footer">
            <p>© 2026 SMOS 管理</p>
        </div>
    </div>
</div>
