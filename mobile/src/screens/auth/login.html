<div class="login-screen" style="padding-top: 80px;">
    <div class="login-logo" style="margin-bottom: 60px;">
        <h1 style="font-size: 40px; font-weight: 800; color: var(--primary-color);">SMOS</h1>
        <p style="color: var(--text-secondary); margin-top: 8px;">Mobile Management System</p>
    </div>
    
    <div id="login-step-1" class="login-form">
        <div class="form-group">
            <label for="username">ユーザーID</label>
            <input type="text" id="username" class="form-input" placeholder="ユーザーIDを入力">
        </div>
        <button id="next-btn" class="login-btn">次へ</button>
    </div>

    <div id="login-step-2" class="login-form" style="display: none;">
        <div class="form-group">
            <label>ユーザーID</label>
            <div id="display-username" style="font-weight: 600; padding: 10px 0;"></div>
        </div>
        <div class="form-group">
            <label for="password">パスワード</label>
            <input type="password" id="password" class="form-input" placeholder="パスワードを入力">
        </div>
        <div style="display: flex; gap: 12px; margin-top: 12px;">
            <button id="back-btn" class="login-btn" style="background-color: #718096; flex: 1;">戻る</button>
            <button id="login-btn" class="login-btn" style="flex: 2;">ログイン</button>
        </div>
    </div>
</div>
